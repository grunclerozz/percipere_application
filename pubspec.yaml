name: percipere_app
description: "Percipere — gesture & voice-controlled assistive reading app."
publish_to: 'none'

version: 0.1.1+2

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & routing
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2

  # Storage
  sqflite: ^2.4.4
  path: ^1.9.1
  path_provider: ^2.1.6

  # Reading pipeline
  google_mlkit_text_recognition: ^0.17.1
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5
  audio_session: ^0.2.4
  camera: ^0.12.1
  image_picker: ^1.2.3
  file_picker: ^13.1.0
  archive: ^4.3.0
  xml: ^7.1.0
  pdfrx: ^2.6.5

  # Network
  dio: ^5.11.1
  connectivity_plus: ^7.3.1

  # Platform
  vibration: ^3.2.1
  permission_handler: ^13.0.2
  android_intent_plus: ^6.1.0
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0

  # Utilities
  intl: ^0.20.3
  uuid: ^4.6.0
  crypto: ^3.0.7
  csv: ^8.0.0
  share_plus: ^13.3.0
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  google_mlkit_image_labeling: ^0.16.1
  image: ^4.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  sqflite_common_ffi: ^2.4.3
  fake_async: ^1.3.3
  cross_file: ^0.3.5
flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/percy/model.json
    - assets/percy/persona.json
    - assets/percy/responses.json

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat/Montserrat-Bold.ttf
          weight: 700
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible/AtkinsonHyperlegible-Bold.ttf
          weight: 700
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend/Lexend-Regular.ttf
        - asset: assets/fonts/Lexend/Lexend-Medium.ttf
          weight: 500
        - asset: assets/fonts/Lexend/Lexend-Bold.ttf
          weight: 700

